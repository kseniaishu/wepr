<!DOCTYPE html>
<html lang="en">
<head>
    <title>Predict Weather</title>
    <link rel="stylesheet" href="static/styles.css">
    <style>
        body {
            display: flex; /* Use flexbox for layout */
            margin: 0; /* Remove default margin */
            height: 100vh; /* Full height of the viewport */
        }
        .sidebar {
            width: 100px; /* Set width for the sidebar */
            height: 100vh; /* Set height to 100% of the viewport */
            background-color: rgb(238, 209, 64); /* Background color for the sidebar */
            padding: 10px; /* Padding around the links */
        }
        .sidebar a {
            display: block; /* Stack links vertically */
            margin: 10px 0; /* Space between links */
            text-decoration: none; /* Remove underline from links */
            color: rgb(0, 0, 0); /* Link color */
        }
        .content {
            margin-left: 20px; /* Space between sidebar and content */
            flex-grow: 1; /* Allow content to take remaining space */
            display: flex; /* Use flexbox for content */
            flex-direction: column; /* Arrange children in a column */
            justify-content: space-between; /* Space between items */
        }
        .image-container {
            display: flex; /* Arrange images in a row */
            margin-top: auto; /* Push the image container to the bottom */
        }
        .bottom-image {
            margin-right: 10px; /* Space between images */
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="index.html">About</a>
        <a href="weather.html">Weather</a>
        <a href="https://aeta.io/earthquake-science-page/">Earthquakes</a>
    </div>
    <div class="content">
        <h1>Predicting Weather Together</h1>
    <form action="results.html" method="get">
        <label for="date">Enter Date (YYYY-MM-DD):</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="city">Select City:</label>
        <input name="city" list="cities" placeholder="Choose a city" required>
        <datalist id="cities">
            <option value="Barcelona">
            <option value="Bilbao">
            <option value="Caceres">
            <option value="Huesca">
            <option value="Leon">
            <option value="Lisboa">
            <option value="Lugo">
            <option value="Madrid">
            <option value="Murcia">
            <option value="Salamanca">
        </datalist><br><br>

        <button type="submit">Predict Weather</button>
    </form>
        <div class="image-container">
            <img class="bottom-image" src="flowers_bottom.jpg" alt="flowers" width="400">
            <img class="bottom-image" src="flowers_bottom.jpg" alt="flowers" width="400">
            <img class="bottom-image" src="flowers_bottom.jpg" alt="flowers" width="400">
        </div>
    </div>
    
</body>
</html>
